<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบลงทะเบียนสุขภาพพะเยา</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  
  <style>
    body { 
      font-family: 'Prompt', sans-serif; 
      font-size: 16px; 
      background-color: #f4f7f6; 
      padding: 20px; 
    }
    .register-card { 
      background: white; 
      padding: 30px; 
      border-radius: 20px; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
      max-width: 500px; 
      margin: auto; 
    }
    .btn-submit { 
      font-size: 18px; 
      font-weight: 600; 
      padding: 15px; 
      border-radius: 12px; 
      width: 100%; 
      margin-top: 25px; 
    }
    .btn-submit:disabled { 
      background-color: #ccc; 
      cursor: not-allowed; 
      border-color: #ccc; 
    }
  </style>
</head>
<body>

<div class="container">
  <div class="register-card">
    <h3 class="text-center text-primary mb-4" style="font-weight: 600;">
      ลงทะเบียนผู้ใช้งาน
    </h3>
    
    <div id="statusMsg" class="alert alert-warning">
      ⏳ กำลังเริ่มต้นระบบ...
    </div>
    
    <form id="healthForm">
      <input type="hidden" id="userId">
      
      <div class="mb-3">
        <label class="form-label">ชื่อโปรไฟล์ LINE</label>
        <input type="text" id="displayName" class="form-control" readonly 
               style="background-color: #e9ecef;" placeholder="รอดึงข้อมูล...">
      </div>

      <div class="mb-3">
        <label class="form-label">ชื่อ-นามสกุล จริง <span class="text-danger">*</span></label>
        <input type="text" id="fullName" class="form-control" 
               placeholder="ระบุชื่อและนามสกุล" required>
      </div>

      <div class="mb-3">
        <label class="form-label">เบอร์โทรศัพท์ <span class="text-danger">*</span></label>
        <input type="tel" id="phone" class="form-control" 
               placeholder="08xxxxxxxx" required>
      </div>

      <div class="mb-3">
        <label class="form-label">กลุ่มผู้ใช้งาน <span class="text-danger">*</span></label>
        <select id="userGroup" class="form-select" required>
          <option value="" disabled selected>-- เลือกกลุ่ม --</option>
          <option value="ทั่วไป">บุคคลทั่วไป</option>
          <option value="ผู้สูงอายุ">ผู้สูงอายุ</option>
          <option value="ผู้พิการ">ผู้พิการ</option>
          <option value="เจ้าหน้าที่">เจ้าหน้าที่ / อสม.</option>
        </select>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary btn-submit" disabled>
        บันทึกข้อมูล
      </button>
    </form>
  </div>
</div>

<script>
  // ⭐ ตั้งค่าตรงนี้
  const LIFF_ID = "2009140190-NJNcljsF";
  
  // ⭐ Google Apps Script Web App URL (ใช้เป็น Backend API)
  const GAS_URL = "https://script.google.com/macros/s/AKfycbwncpq8VF-jqj8gGdRjgHZVmGLxIBxpFjJpnhnm6XDZRdL0x-tx6NTGgWQMYXjYzyIQ/exec";

  function updateStatus(msg, type = 'warning') {
    const el = document.getElementById('statusMsg');
    const colors = {
      'success': 'alert-success',
      'warning': 'alert-warning', 
      'danger': 'alert-danger',
      'info': 'alert-info'
    };
    el.className = 'alert ' + (colors[type] || 'alert-warning');
    el.innerHTML = msg;
  }

  async function initLiff() {
    try {
      updateStatus('⏳ กำลังโหลด LIFF...', 'info');
      
      await liff.init({ liffId: LIFF_ID });

      if (!liff.isLoggedIn()) {
        updateStatus('🔑 กำลังนำไปหน้า Login...', 'warning');
        liff.login();
        return;
      }

      updateStatus('⏳ กำลังดึงข้อมูลโปรไฟล์...', 'info');
      const profile = await liff.getProfile();
      
      document.getElementById('displayName').value = profile.displayName;
      document.getElementById('userId').value = profile.userId;
      document.getElementById('submitBtn').disabled = false;
      
      updateStatus('✅ เชื่อมต่อสำเร็จ: ' + profile.displayName, 'success');

    } catch (error) {
      updateStatus('❌ เกิดข้อผิดพลาด: ' + error.message, 'danger');
      Swal.fire('เกิดข้อผิดพลาด', error.message, 'error');
    }
  }

  window.onload = initLiff;

  // ส่งข้อมูลไป Google Apps Script ด้วย fetch() แทน google.script.run
  document.getElementById('healthForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const userId = document.getElementById('userId').value;
    const fullName = document.getElementById('fullName').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const userGroup = document.getElementById('userGroup').value;
    
    if (!userId || !fullName || !phone || !userGroup) {
      Swal.fire('ข้อผิดพลาด', 'กรุณากรอกข้อมูลให้ครบ', 'warning');
      return;
    }

    Swal.fire({
      title: 'กำลังบันทึก...',
      allowOutsideClick: false,
      didOpen: () => Swal.showLoading()
    });

    try {
      const params = new URLSearchParams({
        action: 'saveUser',
        userId: userId,
        fullName: fullName,
        phone: phone,
        userGroup: userGroup
      });

      const response = await fetch(GAS_URL + '?' + params.toString());
      const result = await response.json();
      
      if (result.status === 'success') {
        Swal.fire('สำเร็จ!', result.message, 'success').then(() => {
          if (liff.isInClient()) liff.closeWindow();
        });
      } else {
        Swal.fire('ผิดพลาด', result.message, 'error');
      }
    } catch (error) {
      Swal.fire('ผิดพลาด', 'ไม่สามารถบันทึกข้อมูลได้: ' + error.message, 'error');
    }
  });
</script>

</body>
</html>
